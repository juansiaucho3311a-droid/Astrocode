<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroCode — Destruye asteroides escribiendo código</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-container">

    <!-- Canvas principal donde se dibuja todo el juego -->
    <canvas id="gameCanvas"></canvas>

    <!-- HUD: puntaje, nivel y vidas -->
    <div id="hud">
      <div class="hud-item">SCORE: <span id="score">0</span></div>
      <div class="hud-item">NIVEL: <span id="level">1</span></div>
      <div class="hud-item">VIDAS: <span id="lives">❤❤❤</span></div>
    </div>

    <!-- Pantalla de inicio -->
    <div id="start-screen" class="overlay">
      <h1>ASTRO<span class="accent">CODE</span></h1>
      <p>Escribe las palabras antes de que los asteroides lleguen a tu nave.</p>
      <button id="startBtn">JUGAR</button>
      <p class="hint">Empieza a escribir cualquier letra para seleccionar un asteroide.</p>
    </div>

    <!-- Pantalla de Game Over -->
    <div id="gameover-screen" class="overlay hidden">
      <h1>GAME OVER</h1>
      <p id="finalScore">Puntaje final: 0</p>
      <button id="restartBtn">REINTENTAR</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
